services:
  gridap-lab:
    # Public image on Guthub Container Registry
    image: ghcr.io/bitsarebits/gridap-neuraloperators-gsoc2026:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JULIA_CPU_TARGET: "native"
        BUILD_THREADS: "4"
      ulimits:
        nofile:
          soft: 65536
          hard: 65536
    container_name: gridap-neuraloperators
    restart: unless-stopped

    # Use a tiny init process (tini) as PID 1 to reap zombie processes and forward signals properly
    init: true

    # Forward SIGINT (Ctrl+C) instead of SIGTERM to let Julia handle graceful shutdown without C runtime dumps
    stop_signal: SIGINT

    # Allow up to 30 seconds for the Julia tasks to complete cleanup before forcing kill
    stop_grace_period: 30s

    # Run Julia as an Ubuntu user so that files in ./data and ./plots are not owned by root
    user: "${UID:-1000}:${GID:-1000}"

    # Share host IPC namespace: allows direct host /dev/shm access and zero-copy IPC for XLA (Reactant.jl) & NCCL/CUDA
    ipc: host

    # Exposes the port ONLY to localhost (127.0.0.1) on your host machine for security.
    ports:
      - "127.0.0.1:8080:8080"

    environment:
      - JULIA_NUM_THREADS=auto
      - JULIA_SERVER_HOST=0.0.0.0
      - JULIA_SERVER_PORT=8080

    # BIND MOUNTS: Links folders on your host machine to those inside the container.
    # All FEM snapshots (.jld2), model weights, plots (.json), and registry.json
    # are physically saved on your hard drive and persist even if the container get deleted
    volumes:
      - ./data:/app/data
      - ./plots:/app/plots
