services:
  gridap-lab:
    image: ghcr.io/bitsarebits/gridap-neuraloperators-gsoc2026:latest

    container_name: gridap-neuraloperators

    restart: unless-stopped
    init: true

    stop_signal: SIGINT
    stop_grace_period: 30s

    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      JULIA_NUM_THREADS: auto
      JULIA_SERVER_HOST: 0.0.0.0
      JULIA_SERVER_PORT: "8080"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    volumes:
      - ./data:/app/data
      - ./plots:/app/plots
