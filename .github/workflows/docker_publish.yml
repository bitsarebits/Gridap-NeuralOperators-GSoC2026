name: Build and Publish Docker Image

on:
    push:
        branches:
            - main
        paths:
            - "src/**"
            - "scripts/**"
            - "dashboard/**"
            - "Project.toml"
            - "Manifest.toml"
            - "Dockerfile"
            - ".github/workflows/docker_publish.yml"
    workflow_dispatch: # Allows to run the build manually from Github Actions tab

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # Free ~25 GB of disk space on Github VM (Reactant + Sysimage)
            - name: Maximize build disk space
              run: |
                  sudo rm -rf /usr/share/dotnet
                  sudo rm -rf /usr/local/lib/android
                  sudo rm -rf /opt/ghc
                  sudo rm -rf /opt/hostedtoolcache/CodeQL
                  df -h

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry (GHCR)
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and Push Universal Docker Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  # GHCR requires that the image name is lowercase
                  tags: ghcr.io/bitsarebits/gridap-neuraloperators-gsoc2026:latest
                  build-args: |
                      JULIA_CPU_TARGET=generic;sandybridge,-xsaveopt;haswell,-rdrnd,base(1)
                      BUILD_THREADS=2
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
